backend:
  name: github
  repo: SarEternal/sar-studios
  branch: main

media_folder: "images"
public_folder: "images"

collections:
  - name: "films"
    label: "Films"
    files:
      - name: "films"
        label: "Films List"
        file: "_data/films.json"
        fields:
          - label: "Films"
            name: "root"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Duration (e.g. 12 min)", name: "duration", widget: "string" }
              - { label: "Genre", name: "genre", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Poster Image URL (from Cloudinary)", name: "poster", widget: "string" }
              - { label: "YouTube or Vimeo URL", name: "videoUrl", widget: "string" }

  - name: "team"
    label: "Team"
    files:
      - name: "team"
        label: "Team Members"
        file: "_data/team.json"
        fields:
          - label: "Team Members"
            name: "root"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Photo URL (from Cloudinary)", name: "photo", widget: "string" }
